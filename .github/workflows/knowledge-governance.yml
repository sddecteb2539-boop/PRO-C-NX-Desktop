name: Knowledge governance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  knowledge-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test learning gate
        run: python3 scripts/test-knowledge.py
      - name: Check learning record
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-knowledge.py --base "$BASE_SHA" --head HEAD
