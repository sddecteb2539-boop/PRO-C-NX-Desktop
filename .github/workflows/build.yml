name: Build PRO-C NX Desktop

# Lives in the PUBLIC repo sddecteb2539-boop/PRO-C-NX-Desktop (Actions minutes are free for public repos).
# Pulls the private source with SOURCE_TOKEN (read-only), builds the Windows installer,
# and publishes it as a Release of THIS repo (the app's auto-update feed). Source code never lands here.
#  · Actions → Run workflow, version blank  = test build (installer as artifact)
#  · Actions → Run workflow, version 1.0.1  = release v1.0.1 (installed apps update themselves)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1) — blank = test build only'
        required: false
      ref:
        description: 'Source branch / tag'
        default: main

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sddecteb2539-boop/PRO-C-ANALYSIS-NX
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
      - name: Build the web app (single file)
        working-directory: src/web
        run: node build.mjs
      - name: Copy the app + offline copies of its CDN libraries
        shell: bash
        working-directory: src
        run: |
          cp web/dist/pro-c-web.html desktop/app/
          get() { mkdir -p "desktop/app/cdn/$(dirname "$2")"; curl -fsSL "$1" -o "desktop/app/cdn/$2"; }
          get https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js npm/pdfjs-dist_3.11.174/build/pdf.min.js
          get https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js npm/pdfjs-dist_3.11.174/build/pdf.worker.min.js
          get https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js npm/tesseract.js_5/dist/tesseract.min.js
          get https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/sarabun/Sarabun-Regular.ttf gh/google/fonts_main/ofl/sarabun/Sarabun-Regular.ttf
          # public key for offline per-machine licenses (signed by the owner's UPDATE_SIGNING_KEY)
          curl -fsSL https://pro-c-analysis-nx.sddecteb2539.workers.dev/update/key -o desktop/app/license-key.json || echo '{}' > desktop/app/license-key.json
          cat desktop/app/license-key.json
      - name: Set version
        if: inputs.version != ''
        shell: bash
        working-directory: src/desktop
        run: npm pkg set version="${{ inputs.version }}"
      - name: Install Electron
        working-directory: src/desktop
        run: npm install --no-audit --no-fund
      - name: Build the installer
        shell: bash
        working-directory: src/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # publishing to THIS repo needs no extra token
        run: |
          if [ -n "${{ inputs.version }}" ]; then P=always; else P=never; fi
          npx electron-builder --win --x64 --publish $P
      - uses: actions/upload-artifact@v4
        with:
          name: PRO-C-NX-Setup
          path: src/desktop/release/*.exe
          if-no-files-found: error
